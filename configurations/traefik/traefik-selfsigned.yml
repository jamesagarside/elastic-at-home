# Traefik Configuration - Self-Signed Mode
#
# This configuration uses ES CA-signed certificates for all services.
# All domain names are included as SANs in a single certificate.
#
# Browser Access:
#   Click "proceed to site" when prompted about the untrusted certificate.
#   Use incognito/private browsing if you encounter cached certificate issues.
#
# Agent Enrolment:
#   Agents connecting to Fleet/ES should trust the CA certificate:
#   docker cp $(docker compose ps -q setup):/usr/share/elasticsearch/config/certs/ca/ca.crt ./ca.crt
#
# No ACME/Let's Encrypt - works in air-gapped environments.

# Dashboard and API. Only reachable through the routers on the traefik
# container (docker-compose.1.traefik.yaml), which TRAEFIK_DASHBOARD in .env
# turns on or off. There's no login, so turn it off on networks you don't trust.
api:
  dashboard: true

ping: true

accessLog:
  format: json

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yaml

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}
  # Dashboard over plain HTTP on port 8080 (also serves the /ping healthcheck)
  traefik:
    address: ":8080"
  syslog-tcp:
    address: ":514"
  syslog-udp:
    address: ":514/udp"

# TLS and serversTransports are loaded from dynamic.yaml
