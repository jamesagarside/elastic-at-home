# Traefik Configuration - Direct Access Mode
#
# This configuration provides port-based routing for IP access.
# Access services directly via host IP and service-specific ports:
#   - Elasticsearch: https://<host-ip>:9200
#   - Kibana:        https://<host-ip>:5601
#   - Fleet Server:  https://<host-ip>:8220
#   - APM Server:    https://<host-ip>:8200
#
# Browser Access:
#   Click "proceed to site" when prompted about the untrusted certificate.
#
# Agent Enrolment:
#   Agents connecting to Fleet/ES should trust the CA certificate:
#   docker cp $(docker compose ps -q setup):/usr/share/elasticsearch/config/certs/ca/ca.crt ./ca.crt
#
# No DNS configuration required - works with IP addresses only.

# Dashboard and API. Only reachable through the routers on the traefik
# container (docker-compose.1.traefik.yaml), which TRAEFIK_DASHBOARD in .env
# turns on or off. There's no login, so turn it off on networks you don't trust.
api:
  dashboard: true

ping: true

accessLog:
  format: json

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yaml

# Port-based entrypoints for direct IP access (no hostname routing)
entryPoints:
  # Service-specific ports for direct access
  elasticsearch:
    address: ":9200"
  kibana:
    address: ":5601"
  fleet:
    address: ":8220"
  apm:
    address: ":8200"
  # Ollama LLM API (optional — only used when llm-ingress profile is active)
  ollama:
    address: ":11434"
  # Syslog entrypoints
  # Dashboard over plain HTTP on port 8080 (also serves the /ping healthcheck)
  traefik:
    address: ":8080"
  syslog-tcp:
    address: ":514"
  syslog-udp:
    address: ":514/udp"

# TLS, routers, services, and serversTransports are loaded from dynamic.yaml
