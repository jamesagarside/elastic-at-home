name: Version Update Gate

# Runs after CI completes on the automated version-update PR and decides what happens:
#   - all CI green + Go/No-Go = GO  -> approve, merge, and (on an Elastic change) release
#   - Go/No-Go = NO_GO              -> block merge, ping the maintainer (human look needed)
#   - any CI check failed          -> open a tracking issue, tag the maintainer, and
#                                      launch the Copilot coding agent to investigate
#   - a major Elastic bump         -> always opens a heads-up issue, even on success
#
# Triggered by workflow_run (so it runs in the trusted default-branch context with a
# writable token, not the restricted PR token). Re-entrant: each CI workflow completion
# fires it; it exits quietly until ALL expected checks have concluded.
# See docs/adr/0001-automated-version-update-release-pipeline.md.

on:
  workflow_run:
    workflows:
      - "Test Direct Access Deployment"
      - "Test Self-Signed Deployment"
      - "Test LLM Integration"
      - "Validate Let's Encrypt Config"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to evaluate (manual re-run)'
        required: false
        default: ''

permissions:
  contents: write       # cut release / tag
  pull-requests: write  # approve, merge, comment
  issues: write         # escalation + major heads-up issues
  actions: read         # read CI run conclusions

# The gate fires once per CI workflow completion (~4×). Cancel superseded runs so only
# the latest — the one that sees ALL checks concluded — does the evaluation. This avoids
# duplicate reviews/comments and a pile-up of concurrent evaluations of the same PR.
concurrency:
  group: version-update-gate
  cancel-in-progress: true

env:
  PR_BRANCH: chore/version-update
  FAILURE_LABEL: version-update-failure
  MAINTAINER: jamesagarside
  REPO: ${{ github.repository }}

jobs:
  gate:
    name: Evaluate and act
    runs-on: ubuntu-latest
    steps:
      # ----- Locate the version-update PR this event relates to ---------------------
      - name: Locate PR
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          PROCEED=false; PR=""; SHA=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "${DISPATCH_PR:-}" ]]; then
              # Validate before use — never trust a dispatch input shape.
              if [[ ! "$DISPATCH_PR" =~ ^[0-9]+$ ]]; then
                echo "::error::pr input must be a number"; exit 1
              fi
              PR="$DISPATCH_PR"
              SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
              PROCEED=true
            fi
          else
            # Only react to CI runs on our automated branch.
            if [[ "$EVENT_BRANCH" == "$PR_BRANCH" ]]; then
              PR_JSON=$(gh pr list --repo "$REPO" --head "$PR_BRANCH" --state open \
                --json number,headRefOid --jq '.[0]' 2>/dev/null || echo "")
              if [[ -n "$PR_JSON" && "$PR_JSON" != "null" ]]; then
                PR=$(echo "$PR_JSON" | jq -r '.number')
                SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
                # Ignore stale runs whose SHA is no longer the PR head.
                if [[ "$SHA" == "$EVENT_SHA" ]]; then PROCEED=true; fi
              fi
            fi
          fi

          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Proceed=$PROCEED PR=$PR SHA=$SHA"

      - name: Checkout (default branch, trusted)
        if: steps.locate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      # ----- Aggregate the expected CI conclusions for this PR head -----------------
      - name: Evaluate CI status
        id: ci
        if: steps.locate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.locate.outputs.sha }}
        run: |
          set -euo pipefail
          EXPECTED=( "Test Direct Access Deployment" \
                     "Test Self-Signed Deployment" \
                     "Test LLM Integration" \
                     "Validate Let's Encrypt Config" )

          RUNS=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
            --jq '[.workflow_runs[] | {name, status, conclusion, html_url, created_at}]')

          STATE="green"; FAILED_URLS=""
          for wf in "${EXPECTED[@]}"; do
            LATEST=$(echo "$RUNS" | jq -c --arg n "$wf" \
              '[.[] | select(.name==$n)] | sort_by(.created_at) | last')
            if [[ "$LATEST" == "null" || -z "$LATEST" ]]; then
              echo "Pending: $wf has not run yet for this SHA"
              STATE="pending"; break
            fi
            STATUS=$(echo "$LATEST" | jq -r '.status')
            CONCL=$(echo "$LATEST" | jq -r '.conclusion')
            if [[ "$STATUS" != "completed" ]]; then
              echo "Pending: $wf is $STATUS"
              STATE="pending"; break
            fi
            if [[ "$CONCL" != "success" ]]; then
              echo "Failed: $wf -> $CONCL"
              URL=$(echo "$LATEST" | jq -r '.html_url')
              FAILED_URLS="${FAILED_URLS}- ${wf}: ${CONCL} (${URL})"$'\n'
              STATE="failed"
            fi
          done

          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          {
            echo "failed_urls<<__EOF__"
            printf '%s' "$FAILED_URLS"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "CI state: $STATE"

      # ----- Parse the machine-readable metadata from the PR body -------------------
      - name: Parse PR metadata
        id: meta
        if: steps.locate.outputs.proceed == 'true' && steps.ci.outputs.state != 'pending'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.locate.outputs.pr }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json body --jq '.body' > pr_body.txt
          # Extract the JSON between the version-update-meta markers.
          META=$(awk '/<!-- version-update-meta/{f=1;next} /-->/{f=0} f' pr_body.txt | tr -d '\r')
          if [[ -z "$META" ]] || ! echo "$META" | jq empty 2>/dev/null; then
            echo "::error::Could not parse version-update metadata from PR body."
            exit 1
          fi
          {
            echo "elastic_old=$(echo "$META" | jq -r '.elastic_old')"
            echo "elastic_new=$(echo "$META" | jq -r '.elastic_new')"
            echo "elastic_changed=$(echo "$META" | jq -r '.elastic_changed')"
            echo "traefik_old=$(echo "$META" | jq -r '.traefik_old')"
            echo "traefik_new=$(echo "$META" | jq -r '.traefik_new')"
            echo "traefik_changed=$(echo "$META" | jq -r '.traefik_changed')"
            echo "is_major=$(echo "$META" | jq -r '.is_major')"
          } >> "$GITHUB_OUTPUT"

      # ===== GREEN PATH: Go/No-Go review ===========================================
      # The rule being enforced here is entirely mechanical — "exactly these version
      # strings, in exactly these files, and nothing else" — and the expected values
      # are already known from the PR metadata parsed above. So it is checked directly
      # against the diff rather than asked of a model.
      #
      # This used to be a GitHub Models call (openai/gpt-5). That endpoint is being
      # retired and returned github_models_retirement_brownout on every attempt, which
      # tripped the fail-safe and left a green, clean 9.5.0 bump blocked as NO_GO. A
      # decidable check should not depend on a remote service being up. See ADR 0001.
      - name: Go/No-Go review (deterministic diff check)
        id: review
        if: steps.locate.outputs.proceed == 'true' && steps.ci.outputs.state == 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.locate.outputs.pr }}
          EO: ${{ steps.meta.outputs.elastic_old }}
          EN: ${{ steps.meta.outputs.elastic_new }}
          EC: ${{ steps.meta.outputs.elastic_changed }}
          TO: ${{ steps.meta.outputs.traefik_old }}
          TN: ${{ steps.meta.outputs.traefik_new }}
          TC: ${{ steps.meta.outputs.traefik_changed }}
        run: |
          set -euo pipefail

          VERDICT="GO"
          REASONS=()
          note() { VERDICT="NO_GO"; REASONS+=("$1"); }

          # Versions are interpolated into regexes below, so escape regex metacharacters:
          # unescaped, "9.4.4" would also match "91444".
          esc() { printf '%s' "$1" | sed -e 's/[][\\.^$*+?(){}|]/\\&/g'; }
          EOR=$(esc "$EO"); ENR=$(esc "$EN")
          TOR=$(esc "$TO"); TNR=$(esc "$TN")

          # A bump that claims to change nothing has nothing to release.
          if [[ "$EC" != "true" && "$TC" != "true" ]]; then
            note "PR metadata reports no version change at all"
          fi

          # --- 0. Fetch, without letting a transport error abort the step -------------
          # `gh` failing is not the same as a bad diff, but under `set -e` it would kill
          # the step outright — and a dead step emits no verdict, so the NO_GO comment
          # never posts and the PR sits blocked with no explanation at all. That is the
          # exact failure this workflow is being changed to stop producing. So a fetch
          # error becomes a NO_GO carrying its own reason, and the step still succeeds.
          FETCHED=1
          if ! gh pr diff "$PR" --repo "$REPO" --name-only > changed_raw.txt 2> gh_err.txt; then
            note "could not fetch the PR file list: $(head -c 120 gh_err.txt | tr -d '\n')"
            FETCHED=0
          fi
          if ! gh pr diff "$PR" --repo "$REPO" > diff.txt 2> gh_err.txt; then
            note "could not fetch the PR diff: $(head -c 120 gh_err.txt | tr -d '\n')"
            FETCHED=0
          fi

          if (( FETCHED )); then
            # --- 1. The changed-file set must match the claim exactly -----------------
            # Not "is a subset of an allowlist": if elastic_changed=true then
            # .env.example and the README badge MUST both move, and if it is false they
            # must NOT.
            EXPECTED_FILES=()
            [[ "$EC" == "true" ]] && EXPECTED_FILES+=(".env.example" "README.md")
            [[ "$TC" == "true" ]] && EXPECTED_FILES+=("docker-compose.1.traefik.yaml")

            # Compared via files rather than arrays: EXPECTED_FILES is legitimately empty
            # when the metadata claims no change, and an empty-array expansion would
            # otherwise smuggle a blank entry into the comparison.
            printf '%s\n' ${EXPECTED_FILES[@]+"${EXPECTED_FILES[@]}"} | sed '/^$/d' | sort -u > wanted.txt
            sed '/^$/d' changed_raw.txt | sort -u > changed.txt

            while IFS= read -r f; do
              grep -qxF "$f" wanted.txt || note "unexpected file changed: ${f}"
            done < changed.txt
            while IFS= read -r f; do
              grep -qxF "$f" changed.txt || note "expected file did not change: ${f}"
            done < wanted.txt

            # --- 2. Every changed line must be one of the expected version edits ------
            # Walk the unified diff tracking the current file, and match each +/- line
            # against the single edit that file is permitted to contain. Anything else —
            # an extra line, a different value, a stray edit riding along in an allowed
            # file — falls through to NO_GO.
            #
            # Filename comes from the `diff --git` header rather than `+++ b/...`, and
            # the header/hunk boundary is tracked explicitly: everything before a file's
            # first @@ is header, everything after is content. Two reasons. A deletion
            # ends its header with `+++ /dev/null`, so keying on `+++ b/` would leave
            # FILE pointing at the *previous* file and misattribute the reason. And a
            # content line reading "++ b/foo" appears in the diff as "+++ b/foo", which a
            # positional match would mistake for a header — letting a line slip past
            # unexamined.
            FILE=""; IN_HUNK=0; NL_MARKS=0
            ENV_OLD=0; ENV_NEW=0; RDM_OLD=0; RDM_NEW=0; TRF_OLD=0; TRF_NEW=0
            RDM_MINUS=""; RDM_PLUS=""

            # "\ No newline at end of file" is emitted per side, so a bump that leaves
            # the trailing newline alone produces two markers for the file and one that
            # changes it produces one. Each allowed file may contain exactly one -/+
            # pair, so an odd count for a file means the newline state moved too.
            check_nl() { (( NL_MARKS % 2 == 0 )) || note "trailing-newline change in ${FILE:-<unknown file>}"; }

            while IFS= read -r line; do
              case "$line" in
                'diff --git '*)
                  check_nl                    # close out the file that just ended
                  REST="${line#diff --git }"
                  FILE="${REST##* b/}"        # b-side name; a/ and b/ agree except on rename
                  IN_HUNK=0; NL_MARKS=0
                  continue ;;
                '@@'*) IN_HUNK=1; continue ;;
              esac

              if (( ! IN_HUNK )); then
                # Still in this file's header block. Not everything a diff can express
                # shows up as a +/- line: a mode flip, rename or binary marker lives
                # here and would otherwise ride along inside an allowed file unexamined
                # (a chmod +x on .env.example passed as GO before this check). Only the
                # inert header lines are accepted; anything else is a structural change.
                case "$line" in
                  'index '*|'--- '*|'+++ '*) ;;
                  *) note "unexpected diff metadata in ${FILE:-<unknown file>}: ${line:0:80}" ;;
                esac
                continue
              fi

              case "$line" in
                '\'*) NL_MARKS=$((NL_MARKS+1)); continue ;;
              esac
              SIGN="${line:0:1}"
              [[ "$SIGN" == "+" || "$SIGN" == "-" ]] || continue   # context line
              BODY="${line:1}"

              OK=0
              case "$FILE" in
                .env.example)
                  if [[ "$SIGN" == "-" && "$BODY" =~ ^STACK_VERSION=${EOR}$ ]]; then OK=1; ENV_OLD=$((ENV_OLD+1)); fi
                  if [[ "$SIGN" == "+" && "$BODY" =~ ^STACK_VERSION=${ENR}$ ]]; then OK=1; ENV_NEW=$((ENV_NEW+1)); fi
                  ;;
                README.md)
                  # Substring-matched only to *identify* the badge line; whether it is
                  # an acceptable edit is decided below by comparing it against its
                  # counterpart. Anchoring the whole line here instead would mean
                  # hardcoding the badge's exact markup.
                  if [[ "$SIGN" == "-" && "$BODY" == *"img.shields.io/badge/Elastic-${EO}-"* ]]; then OK=1; RDM_OLD=$((RDM_OLD+1)); RDM_MINUS="$BODY"; fi
                  if [[ "$SIGN" == "+" && "$BODY" == *"img.shields.io/badge/Elastic-${EN}-"* ]]; then OK=1; RDM_NEW=$((RDM_NEW+1)); RDM_PLUS="$BODY"; fi
                  ;;
                docker-compose.1.traefik.yaml)
                  if [[ "$SIGN" == "-" && "$BODY" =~ ^[[:space:]]*image:[[:space:]]*traefik:v${TOR}[[:space:]]*$ ]]; then OK=1; TRF_OLD=$((TRF_OLD+1)); fi
                  if [[ "$SIGN" == "+" && "$BODY" =~ ^[[:space:]]*image:[[:space:]]*traefik:v${TNR}[[:space:]]*$ ]]; then OK=1; TRF_NEW=$((TRF_NEW+1)); fi
                  ;;
              esac
              if [[ "$OK" != "1" ]]; then
                note "unexpected ${SIGN} line in ${FILE:-<unknown file>}: ${BODY:0:80}"
              fi
            done < diff.txt
            check_nl                        # and the last file in the diff

            # --- 3. Each claimed change must be present, exactly once -----------------
            # Counted, not flagged: two lines that each look right are still not "exactly
            # the expected version bump".
            if [[ "$EC" == "true" ]]; then
              (( ENV_OLD == 1 && ENV_NEW == 1 )) \
                || note "expected exactly one STACK_VERSION ${EO} -> ${EN} edit, saw ${ENV_OLD}/${ENV_NEW}"
              (( RDM_OLD == 1 && RDM_NEW == 1 )) \
                || note "expected exactly one README badge ${EO} -> ${EN} edit, saw ${RDM_OLD}/${RDM_NEW}"
              # The badge line must be identical to its counterpart apart from the
              # version itself. Matching only the shields.io substring would let the rest
              # of the line change freely — including the link target the badge points
              # at, on the project's front page.
              if (( RDM_OLD == 1 && RDM_NEW == 1 )) && [[ "${RDM_MINUS//${EO}/${EN}}" != "$RDM_PLUS" ]]; then
                note "README badge line changed beyond the version: ${RDM_PLUS:0:80}"
              fi
            fi
            if [[ "$TC" == "true" ]]; then
              (( TRF_OLD == 1 && TRF_NEW == 1 )) \
                || note "expected exactly one traefik image v${TO} -> v${TN} edit, saw ${TRF_OLD}/${TRF_NEW}"
            fi
          fi

          if [[ "$VERDICT" == "GO" ]]; then
            REASON="diff is exactly the expected version bump"
          else
            REASON=$(printf '%s; ' "${REASONS[@]}" | tr -d '\n')
            REASON="${REASON%; }"
            REASON="${REASON:0:300}"
          fi

          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Go/No-Go: $VERDICT — $REASON"

      - name: Approve and merge (GO)
        id: merge
        if: steps.review.outputs.verdict == 'GO'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.locate.outputs.pr }}
          REASON: ${{ steps.review.outputs.reason }}
        run: |
          set -euo pipefail
          gh pr review "$PR" --repo "$REPO" --approve --body "Automated Go/No-Go: **GO**. ${REASON}"
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Merged PR #${PR}"

      - name: Cut release (Elastic change)
        if: steps.merge.outputs.merged == 'true' && steps.meta.outputs.elastic_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EO: ${{ steps.meta.outputs.elastic_old }}
          EN: ${{ steps.meta.outputs.elastic_new }}
          TC: ${{ steps.meta.outputs.traefik_changed }}
          TO: ${{ steps.meta.outputs.traefik_old }}
          TN: ${{ steps.meta.outputs.traefik_new }}
        run: |
          set -euo pipefail
          TAG="v${EN}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."; exit 0
          fi

          # Auto-generated notes (lists merged PRs since the previous release — so an
          # interim Traefik-only PR is captured here automatically).
          GEN=$(gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish=main --jq '.body' 2>/dev/null || echo "")

          {
            echo "**Elastic Stack \`${EO}\` → \`${EN}\`**"
            if [[ "$TC" == "true" ]]; then
              echo ""
              echo "**Traefik \`${TO}\` → \`${TN}\`**"
            fi
            echo ""
            echo "$GEN"
          } > notes.md

          gh release create "$TAG" --repo "$REPO" --target main --title "$TAG" --notes-file notes.md
          echo "Released $TAG"

      - name: Close stale broken-release issues
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EN: ${{ steps.meta.outputs.elastic_new }}
          PR: ${{ steps.locate.outputs.pr }}
        run: |
          set -euo pipefail
          # A version that eventually ships is, by definition, not a broken release.
          # CI here fails intermittently (Fleet Server bootstrap timing), so a version
          # can fail one run and pass the next — and nothing used to retract the
          # earlier escalation. That is why open "Broken release" issues for 9.4.3 and
          # 9.4.4 outlived both releases, each with a Copilot PR still attached.
          TITLE="Broken release: Elastic v${EN} fails CI"
          NUMBERS=$(gh issue list --repo "$REPO" --state open --label "$FAILURE_LABEL" \
            --limit 100 --json number,title 2>/dev/null \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[].number' \
            || echo "")

          for n in $NUMBERS; do
            gh issue comment "$n" --repo "$REPO" --body \
              "Elastic \`${EN}\` has now passed CI and merged via PR #${PR}. The earlier failure did not reproduce, so this is no longer a broken release — closing automatically." || true
            gh issue close "$n" --repo "$REPO" --reason completed || true
            echo "Closed stale broken-release issue #${n}"
          done

      - name: Heads-up issue (major bump)
        if: steps.merge.outputs.merged == 'true' && steps.meta.outputs.is_major == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EO: ${{ steps.meta.outputs.elastic_old }}
          EN: ${{ steps.meta.outputs.elastic_new }}
          PR: ${{ steps.locate.outputs.pr }}
        run: |
          set -euo pipefail
          {
            echo "@${MAINTAINER} — a **major** Elastic Stack bump shipped automatically (CI passed)."
            echo ""
            echo "- Elastic Stack: \`${EO}\` → \`${EN}\`"
            echo "- Released as: \`v${EN}\`"
            echo "- Source PR: #${PR}"
            echo ""
            echo "Majors can carry breaking changes that a green test suite won't surface. Worth a sanity check of the running stack and the upstream release notes."
          } > major.md
          gh issue create --repo "$REPO" \
            --title "Heads-up: major Elastic bump v${EN} shipped automatically" \
            --body-file major.md --label version-update || true

      - name: Block and ping (NO_GO)
        if: steps.review.outputs.verdict == 'NO_GO'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.locate.outputs.pr }}
          REASON: ${{ steps.review.outputs.reason }}
        run: |
          set -euo pipefail
          # Idempotent: if this PR is already blocked, don't post a duplicate comment.
          if gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' \
               | grep -qx version-update-blocked; then
            echo "PR #${PR} already blocked; skipping duplicate comment."
            exit 0
          fi
          gh label create version-update-blocked --color fbca04 \
            --description "Automated version update blocked pending human review" --force >/dev/null 2>&1 || true
          {
            echo "@${MAINTAINER} — automated **Go/No-Go = NO_GO**, merge blocked."
            echo ""
            echo "> ${REASON}"
            echo ""
            echo "CI passed, but the gate did not clear this PR for auto-merge — the reason above says exactly what did not line up. Please review; there's nothing for the Copilot agent to fix here, it needs your eyes."
          } > nogo.md
          gh pr comment "$PR" --repo "$REPO" --body-file nogo.md
          gh pr edit "$PR" --repo "$REPO" --add-label version-update-blocked || true

      # ===== FAILURE PATH: escalate + dispatch Copilot coding agent =================
      - name: Escalate broken release
        id: escalate
        if: steps.locate.outputs.proceed == 'true' && steps.ci.outputs.state == 'failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.locate.outputs.pr }}
          EN: ${{ steps.meta.outputs.elastic_new }}
          EO: ${{ steps.meta.outputs.elastic_old }}
          FAILED_URLS: ${{ steps.ci.outputs.failed_urls }}
        run: |
          set -euo pipefail
          gh label create "$FAILURE_LABEL" --color b60205 \
            --description "Automated version update failed CI" --force >/dev/null 2>&1 || true

          TITLE="Broken release: Elastic v${EN} fails CI"
          # Dedup: one open issue per failing target version.
          #
          # This used to filter with `--search "${EN} in:title"`, which does not
          # reliably match a dotted version — the search index tokenises "9.4.4"
          # — so consecutive flaky runs opened duplicate issues for the same
          # version (#23 and #25 were both "Broken release: Elastic v9.4.4").
          # Match the title exactly instead; no search index involved.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label "$FAILURE_LABEL" \
            --limit 100 --json number,title 2>/dev/null \
            | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty' \
            || echo "")

          {
            echo "## Failed checks"
            echo ""
            printf '%s\n' "$FAILED_URLS"
            echo ""
            echo "- Candidate: Elastic Stack \`${EO}\` → \`${EN}\`"
            echo "- Source PR: #${PR}"
          } > fail.md

          if [[ -n "$EXISTING" ]]; then
            {
              echo "Still failing on a later run."
              echo ""
              cat fail.md
            } > comment.md
            gh issue comment "$EXISTING" --repo "$REPO" --body-file comment.md
            echo "issue=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "@${MAINTAINER} — the automated update to Elastic \`${EN}\` did not pass CI, so it was not released."
              echo ""
              cat fail.md
              echo ""
              echo "The Copilot coding agent has been asked to investigate a fix on the \`${PR_BRANCH}\` branch (PR #${PR})."
            } > issue.md
            URL=$(gh issue create --repo "$REPO" --title "$TITLE" \
              --body-file issue.md --label "$FAILURE_LABEL" --assignee "$MAINTAINER")
            NUM=$(echo "$URL" | grep -oE '[0-9]+$')
            echo "issue=$NUM" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Opened issue #${NUM}"
          fi

      - name: Dispatch Copilot coding agent
        if: steps.escalate.outputs.created == 'true'
        env:
          # The Copilot assignment API rejects GitHub App / GITHUB_TOKEN (server-to-server)
          # tokens — it requires a human PAT with Copilot access. So this one step uses a
          # narrow fine-grained PAT (the maintainer's Copilot Pro account). Best-effort:
          # the issue already exists and tags the maintainer regardless.
          GH_TOKEN: ${{ secrets.COPILOT_AGENT_PAT }}
          ISSUE: ${{ steps.escalate.outputs.issue }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          REPO_NAME="${REPO#*/}"
          ISSUE_NODE=$(gh api "repos/${REPO}/issues/${ISSUE}" --jq '.node_id')
          BOT_ID=$(gh api graphql -f query='
            query($o:String!,$n:String!){
              repository(owner:$o,name:$n){
                suggestedActors(capabilities:[CAN_BE_ASSIGNED], first:50){
                  nodes{ login __typename ... on Bot{ id } ... on User{ id } }
                }
              }
            }' -F o="$OWNER" -F n="$REPO_NAME" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id' 2>/dev/null || echo "")

          if [[ -z "$BOT_ID" ]]; then
            echo "::warning::Copilot coding agent not assignable on this repo; issue left for the maintainer."
            exit 0
          fi
          gh api graphql -f query='
            mutation($a:ID!,$b:ID!){
              replaceActorsForAssignable(input:{assignableId:$a, actorIds:[$b]}){
                assignable{ ... on Issue { number } }
              }
            }' -F a="$ISSUE_NODE" -F b="$BOT_ID" \
            && echo "Copilot coding agent dispatched on issue #${ISSUE}" \
            || echo "::warning::Could not dispatch Copilot agent; issue #${ISSUE} left for the maintainer."
